<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MPC - Mon Petit Casino</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d0f">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- En-tête -->
        <header>
            <div class="top-bar">
                <h1>MPC</h1>
                <!-- Le fameux bouton Code en haut -->
                <button id="btn-code" onclick="ouvrirModalCode()">CODE</button>
            </div>
            
            <!-- Le clic sur le solde lance maintenant le mini-jeu -->
            <div id="solde-container" onclick="lancerMiniJeu()">
                <span id="solde-text">0</span> <span class="currency">€</span>
            </div>
        </header>

        <!-- Menu des jeux -->
        <main class="menu-jeux">
            <button class="btn-jeu">♠️ Poker</button>
            <button class="btn-jeu">♣️ Blackjack</button>
            <button class="btn-jeu">🎰 Roulette</button>
        </main>

        <!-- Panneau Admin (Trésorerie) caché par défaut -->
        <div id="admin-panel" style="display: none;">
            <h2>Trésorerie VIP</h2>
            <div class="input-group">
                <input type="number" id="ajout-montant" placeholder="Montant à ajouter">
                <button onclick="ajouterArgent()">Valider</button>
            </div>
        </div>
    </div>

    <!-- Vraie interface (Modal) pour le code secret -->
    <div id="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Accès Restreint</h3>
            <p>Veuillez entrer la clé d'activation.</p>
            <input type="password" id="input-code" placeholder="••••">
            <div class="modal-actions">
                <button class="btn-annuler" onclick="fermerModalCode()">Annuler</button>
                <button class="btn-valider" onclick="validerCode()">Déverrouiller</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker enregistré avec succès !"));
        }
    </script>
</body>
</html>
